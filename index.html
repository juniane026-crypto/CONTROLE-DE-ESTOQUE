<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Estoque</title>
 
<link rel="stylesheet" href="style.css">
 
</head>
<body>
 
<header>
<h1>CONTROLE DE ESTOQUE AUTO PEÇAS E PNEUS</h1>
</header>
 
<div class="container">
 
<div class="cards">
 
<div class="card">
<h3>Total de Produtos</h3>
<h2 id="totalProdutos">0</h2>
</div>
 
<div class="card">
<h3>Total em Estoque</h3>
<h2 id="totalEstoque">0</h2>
</div>
 
<div class="card">
<h3>Valor Total</h3>
<h2 id="valorTotal">R$ 0,00</h2>
</div>
 
</div>
 
<form id="formulario">
 
<h2>Cadastrar Produto</h2>
 
<input
type="text"
id="nome"
placeholder="Nome do Produto"
required>
 
<select id="categoria">
<option>Peça</option>
<option>Pneu</option>
</select>
 
<input
type="text"
id="marca"
placeholder="Marca"
required>
 
<input
type="number"
id="quantidade"
placeholder="Quantidade"
required>
 
<input
type="number"
id="preco"
placeholder="Preço"
step="0.01"
required>
 
<button type="submit">
Salvar Produto
</button>
 
</form>
 
<input
type="text"
id="pesquisa"
placeholder="Pesquisar produto...">
 
<button type="button" onclick="exportarExcel()">
📊 Exportar Excel
</button>
 
<table>
 
<thead>
<tr>
<th>Produto</th>
<th>Categoria</th>
<th>Marca</th>
<th>Qtd</th>
<th>Preço</th>
<th>Ações</th>
</tr>
</thead>
 
<tbody id="lista"></tbody>
 
</table>
 
<div class="historico">
 
<h2>Histórico de Movimentações</h2>
 
<ul id="historico"></ul>
 
</div>
 
</div>
 
./script.jsscript>
 
</body>
</html>
